name: Validate public integrations

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  connectors:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo fmt --manifest-path crates/kitsuvo-connectors/Cargo.toml --check
      - run: cargo test --locked --manifest-path crates/kitsuvo-connectors/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/kitsuvo-connectors/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path crates/kitsuvo-connectors/Cargo.toml
      - run: python scripts/test_connectors.py
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/mcp-http/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: integrations/mcp-http
      - run: npm test
        working-directory: integrations/mcp-http
      - run: npx --yes web-ext@10.7.0 lint --source-dir extensions/firefox --warnings-as-errors
