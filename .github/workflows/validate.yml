name: Validate public integrations

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/mcp-http/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: integrations/mcp-http
      - run: npm test
        working-directory: integrations/mcp-http
      - run: npx --yes web-ext@10.7.0 lint --source-dir extensions/firefox --warnings-as-errors
