app = "kitsuvo-mcp-relay"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  # Public domain ownership proof; this is not an access credential.
  KITSUVO_GLAMA_CLAIM = "glama_claim_UuRwblFfcPPz4uB0lwDXcK90s93EifuR"
  PORT = "8080"
  KITSUVO_CLOUD_ORIGIN = "https://kitsuvo-mcp-relay.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
