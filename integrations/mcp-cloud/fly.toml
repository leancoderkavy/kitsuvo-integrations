app = "kitsuvo-mcp-relay"
primary_region = "sjc"
# The relay drains in-flight requests for up to 10 s on SIGTERM, then asks
# connectors to reconnect and flushes authorization state before exiting.
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "Dockerfile"

[env]
  # Public domain ownership proof; this is not an access credential.
  KITSUVO_GLAMA_CLAIM = "glama_claim_UuRwblFfcPPz4uB0lwDXcK90s93EifuR"
  KITSUVO_CLOUD_STATE_FILE = "/data/authorization.json"
  KITSUVO_TRUST_PROXY_HOPS = "1"
  PORT = "8080"
  KITSUVO_CLOUD_ORIGIN = "https://kitsuvo-mcp-relay.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[mounts]]
  source = "kitsuvo_cloud_state"
  destination = "/data"
