<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; frame-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Kitsuvo browser</title>
  <style>
    :root{color-scheme:light dark;font:14px system-ui,sans-serif;background:var(--color-background-primary,Canvas);color:var(--color-text-primary,CanvasText)}
    *{box-sizing:border-box}body{margin:0;padding:12px}button,input,select{font:inherit;color:inherit;background:var(--color-background-secondary,Canvas);border:1px solid var(--color-border-primary,#8886);border-radius:7px;padding:8px}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#workspace[aria-busy=true] button:disabled{cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #c2410c;outline-offset:2px}header,.toolbar,.actions,form,.element,.brand{display:flex;align-items:center;gap:6px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:10px}h1{font-size:16px;margin:0}.connection{font-size:12px;opacity:.72}.connection::before{content:"";display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:#888}.connection[data-ready=true]::before{background:#2f9e64}#title{font-weight:600;margin:10px 0 2px;overflow-wrap:anywhere}#pageMeta{font-size:12px;opacity:.72;margin-bottom:10px;overflow-wrap:anywhere}.toolbar{margin-bottom:8px}.toolbar form{flex:1;min-width:180px}input{min-width:0}#url{flex:1}#tabs{max-width:100%;flex:1}#status{margin:8px 0 0;min-height:20px;font-size:12px;opacity:.78}#preview{display:block;width:100%;max-height:480px;margin:auto;object-fit:contain;border:1px solid #8885;border-radius:8px;background:var(--color-background-secondary,Canvas)}#preview[hidden]{display:none}#previewNote{font-size:12px;opacity:.72;margin:7px 0}.actions{margin:10px 0}.primary{background:#c2410c;color:#fff;border-color:#c2410c}#evidence{padding:9px 0;border-top:1px solid #8883;border-bottom:1px solid #8883}#evidence strong{display:block;margin-bottom:3px}#evidenceSummary{margin:0;overflow-wrap:anywhere}#inspector{margin:12px 0}#inspector>summary{cursor:pointer;font-weight:600;padding:7px 0}#inspector h2{font-size:13px;margin:16px 0 7px}#elements{display:grid;gap:8px}.element{border-bottom:1px solid #8883;padding:6px 0}.element span{flex:1;min-width:140px;overflow-wrap:anywhere}.element input{flex:1;min-width:120px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace;margin:0}#reportBlock[hidden]{display:none}#workspace[aria-busy=true]{opacity:.65}@media(max-width:420px){body{padding:8px}.toolbar form{flex-basis:100%}.element input{flex-basis:100%}.actions button{flex:1}}
  </style>
</head>
<body>
  <header><div class="brand"><h1>Kitsuvo</h1><span id="connection" class="connection" data-ready="false">Connecting</span></div></header>
  <div id="workspace" aria-busy="false">
    <div id="title"></div>
    <div id="pageMeta"></div>
    <img id="preview" alt="Current page preview" hidden>
    <p id="previewNote"></p>
    <div class="actions">
      <button id="fullscreen" class="primary" disabled>Open full browser</button>
      <button data-action="refresh" disabled>Refresh</button>
      <button id="reconnect" data-action="reconnect" hidden disabled>Reconnect browser</button>
    </div>
    <section id="evidence" aria-labelledby="evidenceTitle" aria-live="polite" hidden><strong id="evidenceTitle">Detection evidence</strong><p id="evidenceSummary"></p></section>
    <details id="inspector"><summary>Page details</summary>
      <h2>Navigate</h2>
      <div class="toolbar">
        <button data-action="back" aria-label="Go back" disabled>←</button>
        <button data-action="forward" aria-label="Go forward" disabled>→</button>
        <button data-action="reload" aria-label="Reload page" disabled>↻</button>
        <form id="navigate"><input id="url" aria-label="Web address" placeholder="Enter a web address" autocomplete="off" disabled><button id="go" type="button" disabled>Go</button></form>
      </div>
      <h2>Browser tools</h2>
      <div class="toolbar"><select id="tabs" aria-label="Browser tab" disabled></select><button data-action="new" disabled>New tab</button><button data-action="close" disabled>Close tab</button></div>
      <div class="toolbar"><button data-action="fit" title="Show this tab in the isolated Kitsuvo window and fit it for a page preview" disabled>Fit preview</button><button data-key="PageUp" disabled>Scroll up</button><button data-key="PageDown" disabled>Scroll down</button><button data-action="report" disabled>Check page evidence</button></div>
      <h2>Page controls</h2>
      <div id="elements"></div>
      <div id="reportBlock" hidden><h2>Full detection evidence</h2><pre id="report"></pre></div>
      <h2>Raw page text</h2>
      <pre id="snapshot"></pre>
    </details>
  </div>
  <p id="status" role="status" aria-live="polite">Connecting to your browser…</p>
  <script>/* BROWSER_APP */</script>
</body>
</html>
