[package]
name = "kitsuvo-connectors"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "LICENSE"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
async-trait = "0.1"
webbrowser = "1"
